<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script>
    if (localStorage.getItem('ps_theme') !== 'light')
      document.documentElement.classList.add('dark-mode');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Destinazione PS – Preferenze Turni</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<header>
  <div class="header-logo">🚑</div>
  <div>
    <h1>Destinazione PS – Preferenze Turni</h1>
    <div class="subtitle">Inserisci le tue desiderata e indisponibilità</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:1rem">
    <span style="font-size:.8rem;opacity:.7"><span class="live-dot"></span>Live</span>
    <button class="btn btn-secondary btn-sm" id="theme-toggle">🌙 Scuro</button>
    <a href="admin.html" class="btn btn-secondary btn-sm">🔧 Admin</a>
  </div>
</header>

<nav class="pub-nav" id="pub-nav" style="display:none">
  <button class="pub-nav-btn active" data-target="richieste">📝 Richieste Aperte</button>
  <button class="pub-nav-btn" data-target="calendari">📋 Calendari definitivi</button>
</nav>

<div class="container" id="slots-container">
  <div id="section-richieste"></div>
  <div id="section-calendari"></div>
</div>

<div class="container" id="no-slot" style="display:none">
  <div class="card" style="text-align:center;padding:3rem">
    <div style="font-size:3rem">📅</div>
    <h2 style="margin-top:1rem;color:#888">Nessun calendario aperto</h2>
    <p style="color:#aaa;margin-top:.5rem">L'amministratore non ha ancora aperto le richieste di preferenza.</p>
  </div>
</div>

<!-- MODAL inserimento nome -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title">Inserisci la tua preferenza</h3>
    <div class="form-group" style="position:relative">
      <label>Il tuo nome</label>
      <input type="text" id="modal-nome-a" placeholder="Cerca il tuo nome…" autocomplete="off">
      <div class="autocomplete-box" id="suggestions-a"></div>
    </div>
    <div class="form-group" style="position:relative">
      <label>In coppia con (opzionale)</label>
      <input type="text" id="modal-nome-b" placeholder="Cerca il nome…" autocomplete="off">
      <div class="autocomplete-box" id="suggestions-b"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Annulla</button>
      <button class="btn btn-primary" id="modal-ok" disabled style="opacity:.4">Conferma</button>
    </div>
  </div>
</div>

<!-- MODAL conferma cancellazione -->
<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal-box">
    <h3>Conferma cancellazione</h3>
    <p id="confirm-text" style="margin-bottom:1.2rem;font-size:.9rem"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirm-cancel">Annulla</button>
      <button class="btn btn-danger" id="confirm-ok">Elimina</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/public.js"></script>
<script>
  const themeBtn = document.getElementById('theme-toggle');
  if (localStorage.getItem('ps_theme') !== 'light') themeBtn.textContent = '☀️ Chiaro';
  themeBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark-mode');
    const isDark = document.documentElement.classList.contains('dark-mode');
    themeBtn.textContent = isDark ? '☀️ Chiaro' : '🌙 Scuro';
    localStorage.setItem('ps_theme', isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
