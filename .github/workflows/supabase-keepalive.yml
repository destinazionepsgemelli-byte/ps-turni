name: Supabase Keep Alive

# Esegue ogni 3 giorni alle 07:00 UTC per prevenire la pausa del DB free tier.
# Supabase pausa i progetti free dopo 7 giorni di inattività.
# Può essere triggerato manualmente da GitHub Actions per testare.

on:
  schedule:
    - cron: '0 7 */3 * *'   # ogni 3 giorni alle 07:00 UTC
  workflow_dispatch:         # trigger manuale per test

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxZ2RuaGlueHZhb2VpY3Bsa2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjkxMTEsImV4cCI6MjA5MzU0NTExMX0.tw3Po_SURv7ycAIkT9sK9XnF9ioVoLUHCSDh8wJrDbA" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxZ2RuaGlueHZhb2VpY3Bsa2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjkxMTEsImV4cCI6MjA5MzU0NTExMX0.tw3Po_SURv7ycAIkT9sK9XnF9ioVoLUHCSDh8wJrDbA" \
            "https://hqgdnhinxvaoeicplkbj.supabase.co/rest/v1/turnisti?select=id&limit=1")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Supabase attivo e raggiungibile"
          else
            echo "Risposta inattesa: $HTTP_STATUS"
            exit 1
          fi
